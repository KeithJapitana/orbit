name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # A build job is intentionally omitted for now: `next build` requires the
  # Supabase, Stripe and Resend environment variables, which are not available
  # to CI yet. Add them as repository secrets, then extend this workflow with a
  # build job that consumes them.
